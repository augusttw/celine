# Uma assinatura tipográfica compacta; a conversa continua sendo o foco.
banner_logo: |-
  [#eadde4]c e l i n e[/]  [#d991aa]♡[/]

# Contraponto curto para terminais largos, sem ilustração ornamental.
banner_hero: |-
  [#776f78]perto  ·  atenta  ·  pronta[/]

